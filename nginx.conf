events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    server {
        listen 3000 default_server;
        listen [::]:3000 default_server;

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # 1. Binance Futures TESTNET
        location /testnet/fapi/ {
            rewrite ^/testnet/(.*) /$1 break;
            proxy_pass https://testnet.binancefuture.com;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_set_header Host testnet.binancefuture.com;
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
            proxy_pass_request_headers on;
            proxy_http_version 1.1;
            proxy_buffering off;
        }

        # 2. Binance Futures MAINNET
        location /mainnet/fapi/ {
            rewrite ^/mainnet/(.*) /$1 break;
            proxy_pass https://fapi.binance.com;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_set_header Host fapi.binance.com;
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
            proxy_pass_request_headers on;
            proxy_http_version 1.1;
            proxy_buffering off;
        }

        # 3. Direct Futures (/fapi/)
        location /fapi/ {
            proxy_pass https://fapi.binance.com;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_set_header Host fapi.binance.com;
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
            proxy_pass_request_headers on;
            proxy_http_version 1.1;
            proxy_buffering off;
        }

        # 4. Default / Spot (api.binance.com)
        location / {
            proxy_pass https://api.binance.com;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_set_header Host api.binance.com;
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
            proxy_pass_request_headers on;
            proxy_http_version 1.1;
            proxy_buffering off;
        }
    }
}
