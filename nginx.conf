events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    server {
        listen 3000 default_server;
        listen [::]:3000 default_server;

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location /ip {
            access_log off;
            default_type application/json;
            return 200 '{"ip":"$remote_addr"}';
            add_header Content-Type application/json;
        }

        # 1. Binance Futures TESTNET
        location /testnet/fapi/ {
            rewrite ^/testnet/(.*) /$1 break;
            proxy_pass https://testnet.binancefuture.com;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_name testnet.binancefuture.com;
            proxy_set_header Host testnet.binancefuture.com;

            proxy_pass_request_headers off;
            proxy_set_header CF-Worker "";
            proxy_set_header CF-Ray "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header CF-IPCountry "";
            proxy_set_header CF-Visitor "";

            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
            proxy_set_header Accept "application/json, text/plain, */*";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;

            # 🔑 CRITICAL FIX: forward the Binance API key header
            proxy_set_header X-MBX-APIKEY $http_x_mbx_apikey;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 2. Binance Futures MAINNET
        location /mainnet/fapi/ {
            rewrite ^/mainnet/(.*) /$1 break;
            proxy_pass https://fapi.binance.com;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_name fapi.binance.com;
            proxy_set_header Host fapi.binance.com;

            proxy_pass_request_headers off;
            proxy_set_header CF-Worker "";
            proxy_set_header CF-Ray "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header CF-IPCountry "";
            proxy_set_header CF-Visitor "";

            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
            proxy_set_header Accept "application/json, text/plain, */*";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header X-MBX-APIKEY $http_x_mbx_apikey;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 3. Direct Futures USDT-M
        location /fapi/ {
            proxy_pass https://fapi.binance.com;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
